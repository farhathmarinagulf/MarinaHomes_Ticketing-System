[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_ATTACHMENT_LIMIT_MB = "4"

# Explicitly enable the adapter so Next.js routes and APIs are deployed.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Set DATABASE_URL, APP_URL,
# REGISTRATION_CODE and COOKIE_SECURE in the Netlify dashboard.
